[project]
name = "claudetrader"
version = "0.1.0"
description = "Paper-trading bot: rule-based strategy, hard risk limits in code, Claude as an optional trade reviewer, Lightweight Charts dashboard."
requires-python = ">=3.10"
dependencies = ["ccxt>=4.4", "pandas>=2.2", "numpy>=1.26", "anthropic>=1.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["claudetrader*"]
